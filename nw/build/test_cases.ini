; =====================================================================
; IEEE 802.3 封装引擎自动化测试数据 (10 个用例)
; 包含边界值测试、格式兼容性测试与异常阻断测试
; =====================================================================

[Test_01_Empty_Payload]
description=边界测试: 数据载荷为空(0字节)，应触发全量46字节补零
dest_mac=FF:FF:FF:FF:FF:FF
src_mac=00:1A:2B:3C:4D:5E
payload=
expect_status=封装成功

[Test_02_1Byte_Payload]
description=边界测试: 数据载荷仅1字节，应触发45字节补零
dest_mac=AA:BB:CC:DD:EE:FF
src_mac=00:11:22:33:44:55
payload=A
expect_status=封装成功

[Test_03_Exact_46Bytes_Payload]
description=边界测试: 数据载荷恰好46字节，Padding应精确为0
dest_mac=11:22:33:44:55:66
src_mac=66:55:44:33:22:11
payload=1234567890123456789012345678901234567890123456
expect_status=封装成功

[Test_04_MAC_Hyphen_Format]
description=格式兼容测试: 目的MAC使用连字符格式 (AA-BB-CC...)
dest_mac=AA-BB-CC-DD-EE-FF
src_mac=00:1A:2B:3C:4D:5E
payload=Testing hyphens MAC
expect_status=封装成功

[Test_05_MAC_No_Delimiter_Format]
description=格式兼容测试: 源MAC无任何分隔符连写格式
dest_mac=AA:BB:CC:DD:EE:FF
src_mac=001A2B3C4D5E
payload=Testing no delimiters MAC
expect_status=封装成功

[Test_06_Invalid_DestMac_Short]
description=异常测试: 目的MAC长度不足 (缺少一组十六进制)
dest_mac=AA:BB:CC:DD:EE
src_mac=00:11:22:33:44:55
payload=Should fail
expect_status=目的 MAC 地址格式非法 (应为12位十六进制)

[Test_07_Invalid_DestMac_Long]
description=异常测试: 目的MAC长度超标 (多出一组)
dest_mac=AA:BB:CC:DD:EE:FF:77
src_mac=00:11:22:33:44:55
payload=Should fail
expect_status=目的 MAC 地址格式非法 (应为12位十六进制)

[Test_08_Invalid_SrcMac_Chars]
description=异常测试: 源MAC包含非十六进制非法字符(含有字母 Z)
dest_mac=AA:BB:CC:DD:EE:FF
src_mac=00:11:22:33:44:ZZ
payload=Should fail
expect_status=源 MAC 地址格式非法 (应为12位十六进制)

[Test_09_MTU_Limit_1500Bytes]
description=边界测试: 载荷恰好达到1500字节(MTU上限)，应该允许封装成功 (下方是1500个X)
dest_mac=AA:BB:CC:DD:EE:FF
src_mac=00:11:22:33:44:55

expect_status=封装成功

[Test_10_Payload_Too_Large_1501Bytes]
description=异常测试: 载荷1501字节(超出MTU上限1字节)，应该被引擎拦截 (下方是1501个X)
dest_mac=AA:BB:CC:DD:EE:FF
src_mac=00:11:22:33:44:55

expect_status=有效载荷过大 (超过 1500 字节 MTU)
